<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dharanee Patel · Portfolio</title>
  <meta name="description" content="Dharanee Patel: software engineer working on machine learning, optimization, and data systems. MS Computer Science at Texas A&M University.">
  <meta property="og:title" content="Dharanee Patel · Portfolio">
  <meta property="og:description" content="Software engineer working on machine learning, optimization, and data systems.">
  <meta name="theme-color" content="#f3f5fb">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230a0e1a'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-weight='700' font-size='26' fill='%23c7d2fe'>DP</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="sky" aria-hidden="true"></div>

  <div class="layout wrap">
    <!-- Left column: stays in place on wide screens -->
    <header class="side" id="top">
      <img class="avatar" id="photo" alt="" width="72" height="72">
      <h1 data-bind="name"></h1>
      <p class="headline" data-bind="headline"></p>
      <p class="intro" data-bind="intro"></p>

      <nav class="nav-links" aria-label="Sections">
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#education">Education</a>
        <a href="#contact">Contact</a>
      </nav>

      <div class="side-links" id="heroLinks"></div>
      <p class="location" data-bind="location"></p>
    </header>

    <!-- Right column: scrolling content -->
    <main id="main">
      <section id="about">
        <h2 class="section-title">About</h2>
        <div class="prose" id="aboutText"></div>
        <div class="stats" id="stats"></div>
      </section>

      <section id="experience">
        <h2 class="section-title">Experience</h2>
        <ol class="rows" id="experienceList"></ol>
      </section>

      <section id="projects">
        <h2 class="section-title">Projects</h2>
        <div class="projects" id="projectList"></div>
        <div id="githubBlock" hidden>
          <h3 class="subhead">More on GitHub</h3>
          <div class="projects small" id="githubList"></div>
        </div>
      </section>

      <section id="skills">
        <h2 class="section-title">Skills</h2>
        <div class="skills" id="skillList"></div>
      </section>

      <section id="education">
        <h2 class="section-title">Education</h2>
        <ol class="rows" id="educationList"></ol>
      </section>

      <section id="contact">
        <h2 class="section-title">Contact</h2>
        <p class="contact-text" data-bind="contactText"></p>
        <div class="contact-grid" id="contactList"></div>
      </section>

      <footer class="footer" id="footer"></footer>
    </main>
  </div>

  <!-- Content lives in data/content.js; rendering logic in assets/js/main.js -->
  <script src="data/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>

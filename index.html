<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dharanee Patel · Portfolio</title>
  <meta name="description" content="Dharanee Patel: software engineer working on AI/ML, optimization, and data systems. MS Computer Science at Texas A&M University.">
  <meta property="og:title" content="Dharanee Patel · Portfolio">
  <meta property="og:description" content="Software engineer working on AI/ML, optimization, and data systems.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232563eb'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-weight='700' font-size='28' fill='white'>DP</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <nav class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="#top" data-bind="name"></a>
      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
        <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main id="main" class="wrap">
    <header class="hero" id="top">
      <img class="avatar" id="photo" alt="" width="128" height="128">
      <div class="hero-text">
        <p class="eyebrow" data-bind="location"></p>
        <h1 data-bind="name"></h1>
        <p class="headline" data-bind="headline"></p>
        <p class="intro" data-bind="intro"></p>
        <div class="btn-row" id="heroLinks"></div>
      </div>
    </header>

    <section id="about">
      <h2 class="section-title">About</h2>
      <div class="prose" id="aboutText"></div>
      <div class="stats" id="stats"></div>
    </section>

    <section id="experience">
      <h2 class="section-title">Experience</h2>
      <ol class="timeline" id="experienceList"></ol>
    </section>

    <section id="projects">
      <h2 class="section-title">Projects</h2>
      <div class="cards" id="projectList"></div>
      <div id="githubBlock" hidden>
        <h3 class="subhead">More on GitHub</h3>
        <div class="cards small" id="githubList"></div>
      </div>
    </section>

    <section id="skills">
      <h2 class="section-title">Skills</h2>
      <div class="skills" id="skillList"></div>
    </section>

    <section id="education">
      <h2 class="section-title">Education</h2>
      <div class="edu" id="educationList"></div>
    </section>

    <section id="contact">
      <h2 class="section-title">Contact</h2>
      <p class="contact-text" data-bind="contactText"></p>
      <div class="contact-grid" id="contactList"></div>
    </section>
  </main>

  <footer class="footer wrap" id="footer"></footer>

  <!-- Content lives in data/content.js; rendering logic in assets/js/main.js -->
  <script src="data/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
